name: CodeQL analysis

# CodeQL em repositório privado exige GitHub Advanced Security (ou Code
# Security) habilitado, e o job nem inicia com o spending limit de Actions
# esgotado (anotação do check: "recent account payments have failed or your
# spending limit needs to be increased"). Por isso não disparamos em
# pull_request: sem GHAS/licenciamento o job falharia em todo PR com status
# vermelho garantido. Reabilitar o trigger de PR quando ambos estiverem
# resolvidos em Settings → Code security e Billing & plans — e, antes de
# confiar em push/schedule, validar as duas linguagens com um smoke run
# manual (workflow_dispatch): a leg csharp/autobuild ainda não rodou neste
# repositório.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
