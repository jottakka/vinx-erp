version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dotnet:
        patterns:
          - "*"
    ignore:
      # Blocked by Microsoft.AspNetCore.OpenApi (< 3.0.0 constraint) — NU1608.
      - dependency-name: "Microsoft.OpenApi"
        versions: [">= 3.0.0"]
      # Blocked by Microsoft.Extensions.AI.OpenAI (< 2.13.0 constraint) — NU1608.
      - dependency-name: "OpenAI"
        versions: [">= 2.13.0"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 (native compiler) changes type inference and fails
      # `tsc -b` (people-page.tsx); migrate in a dedicated PR.
      - dependency-name: "typescript"
        versions: ["7.x"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
